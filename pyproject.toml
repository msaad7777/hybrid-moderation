[project]
name = "hybrid-moderation"
version = "0.1.0"
description = "Hybrid content moderation: a fast classifier for clear cases, a local LLM for the grey zone, measured on Civil Comments and HateCheck"
readme = "README.md"
authors = [
    { name = "Mohammed Saad", email = "59375560+msaad7777@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Detoxify pulls in PyTorch, so CI (which runs only the fast tests) skips it
models = ["detoxify>=0.5.4"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
